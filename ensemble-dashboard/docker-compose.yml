version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ensemble-backend
    ports:
      - "8001:8001"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ../abm-anomaly-ml-first/data/processed:/data/processed
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    networks:
      - ensemble-network

  frontend:
    build: ./frontend
    container_name: ensemble-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ensemble-network

networks:
  ensemble-network:
    driver: bridge

volumes:
  models:
  data:
