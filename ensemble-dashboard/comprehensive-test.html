<!DOCTYPE html>
<html>
<head>
    <title>Comprehensive Backend Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .endpoint { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; }
        .error { background-color: #f8d7da; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Backend API Comprehensive Test</h1>
    <button onclick="testAllEndpoints()">Test All Endpoints</button>
    <div id="results"></div>
    
    <script>
        async function testEndpoint(name, url, method = 'GET', body = null) {
            const results = document.getElementById('results');
            const endpointDiv = document.createElement('div');
            endpointDiv.className = 'endpoint';
            
            try {
                const options = {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    }
                };
                
                if (body) {
                    options.body = JSON.stringify(body);
                }
                
                const response = await fetch(url, options);
                const text = await response.text();
                
                endpointDiv.className += response.ok ? ' success' : ' error';
                endpointDiv.innerHTML = `
                    <h3>${name}</h3>
                    <p><strong>Status:</strong> ${response.status} ${response.statusText}</p>
                    <p><strong>URL:</strong> ${url}</p>
                    <pre>${text}</pre>
                `;
            } catch (error) {
                endpointDiv.className += ' error';
                endpointDiv.innerHTML = `
                    <h3>${name}</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>URL:</strong> ${url}</p>
                `;
            }
            
            results.appendChild(endpointDiv);
        }
        
        async function testAllEndpoints() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing endpoints...</p>';
            
            const endpoints = [
                { name: 'Health Check', url: 'http://localhost:8001/api/health' },
                { name: 'Model Info', url: 'http://localhost:8001/api/model_info' },
                { name: 'Training Stats', url: 'http://localhost:8001/api/training_stats' },
                { name: 'Cluster Insights', url: 'http://localhost:8001/api/cluster_insights' },
                { name: 'Cluster Labels', url: 'http://localhost:8001/api/cluster_labels' },
                { name: 'Cluster Visualization Data', url: 'http://localhost:8001/api/cluster_visualization_data', method: 'POST' },
                { name: 'Performance Comparison', url: 'http://localhost:8001/api/performance_comparison', method: 'POST' },
            ];
            
            for (const endpoint of endpoints) {
                await testEndpoint(endpoint.name, endpoint.url, endpoint.method);
            }
        }
    </script>
</body>
</html>
