<!DOCTYPE html>
<html>
<head>
    <title>Backend Test</title>
</head>
<body>
    <h1>Backend API Test</h1>
    <div id="results"></div>
    
    <script>
        async function testEndpoints() {
            const results = document.getElementById('results');
            const endpoints = [
                { name: 'Health Check', url: 'http://localhost:8001/api/health' },
                { name: 'Model Info', url: 'http://localhost:8001/api/model_info' },
                { name: 'Training Stats', url: 'http://localhost:8001/api/training_stats' }
            ];
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(endpoint.url);
                    const data = await response.text();
                    results.innerHTML += `<h3>${endpoint.name}</h3>`;
                    results.innerHTML += `<p>Status: ${response.status}</p>`;
                    results.innerHTML += `<pre>${data}</pre><hr>`;
                } catch (error) {
                    results.innerHTML += `<h3>${endpoint.name}</h3>`;
                    results.innerHTML += `<p>Error: ${error.message}</p><hr>`;
                }
            }
        }
        
        testEndpoints();
    </script>
</body>
</html>
