<!DOCTYPE html>
<html>
<head>
    <title>Test Sessions API</title>
</head>
<body>
    <h1>Session API Test</h1>
    <button onclick="testAPI()">Test Sessions API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Loading...';
            
            try {
                console.log('Making API request to /api/v1/sessions...');
                const response = await fetch('/api/v1/sessions?limit=10');
                console.log('Response status:', response.status);
                
                const data = await response.json();
                console.log('API Data:', data);
                
                resultDiv.innerHTML = `
                    <h2>API Response:</h2>
                    <p><strong>Total Sessions:</strong> ${data.total}</p>
                    <p><strong>Returned Sessions:</strong> ${data.sessions ? data.sessions.length : 0}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                console.error('API Error:', error);
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
