events {
    worker_connections 1024;
}

http {
    upstream cash_forecasting {
        server cash-forecasting:5000;
    }
    
    upstream main_dashboard {
        server host.docker.internal:3000;  # Your existing dashboard
    }

    # Main server block
    server {
        listen 80;
        server_name localhost;

        # Main dashboard (existing)
        location / {
            proxy_pass http://main_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cash forecasting service
        location /cash-forecasting/ {
            rewrite ^/cash-forecasting/(.*)$ /$1 break;
            proxy_pass http://cash_forecasting;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # API endpoints for cash forecasting
        location /api/cash-forecasting/ {
            rewrite ^/api/cash-forecasting/(.*)$ /api/$1 break;
            proxy_pass http://cash_forecasting;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files for cash forecasting
        location /static/ {
            proxy_pass http://cash_forecasting;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # HTTPS server (if SSL certificates are available)
    # server {
    #     listen 443 ssl http2;
    #     server_name localhost;
    #     
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     
    #     # Same location blocks as above
    # }
}
