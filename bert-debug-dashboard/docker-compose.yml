version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.working
    container_name: bert-debug-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - bert-network

  frontend:
    build: ./frontend
    container_name: bert-debug-frontend
    ports:
      - "3333:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - WDS_SOCKET_PORT=0
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - BROWSER=none
      - FAST_REFRESH=false
      - WDS_SOCKET_HOST=localhost
      - WDS_SOCKET_PATH=/ws
    networks:
      - bert-network

networks:
  bert-network:
    driver: bridge
